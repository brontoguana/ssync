[package]
name = "ssync"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "Password-authenticated native fixed-block file synchronization"
license = "MIT"
repository = "https://github.com/brontoguana/ssync"

[dependencies]
anyhow = "1"
blake3 = "1"
ctrlc = { version = "3", features = ["termination"] }
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
shell-words = "1"
snow = "0.10"
socket2 = "0.6"
opaque-ke = { version = "4", features = ["argon2"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
